name: Update Cosign

on:
  workflow_dispatch:
    inputs:
      cosign-release:
        description: 'Cosign release version to update to (e.g. v3.1.3). Leave empty for the latest release.'
        required: false
        type: string

permissions: {}

jobs:
  update_cosign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    name: Update default Cosign release in action.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine target Cosign release
        id: get_version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_COSIGN_RELEASE: ${{ inputs.cosign-release }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_COSIGN_RELEASE}" ]]; then
            version="v${INPUT_COSIGN_RELEASE#v}"
            if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "Invalid cosign release version format: ${INPUT_COSIGN_RELEASE}" >&2
              exit 1
            fi
            resolved=$(gh api "repos/sigstore/cosign/releases/tags/${version}" --jq '.tag_name')
          else
            resolved=$(gh api repos/sigstore/cosign/releases/latest --jq '.tag_name')
          fi

          if [[ ! "${resolved}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Unexpected release tag from GitHub API: ${resolved}" >&2
            exit 1
          fi

          echo "Resolved Cosign release: ${resolved}"
          echo "version=${resolved}" >> "${GITHUB_OUTPUT}"

      - name: Verify target Cosign release with current installer
        uses: ./
        with:
          cosign-release: ${{ steps.get_version.outputs.version }}
          install-dir: ${{ runner.temp }}/cosign-verify

      - name: Update cosign_checksums.txt, action.yml, and README.md
        id: update_files
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 120 -fsSL \
            "https://github.com/sigstore/cosign/releases/download/${VERSION}/cosign_checksums.txt" \
            -o cosign_checksums.txt

          for required_bin in cosign-darwin-amd64 cosign-darwin-arm64 cosign-linux-amd64 cosign-linux-arm64 cosign-linux-arm cosign-windows-amd64.exe; do
            if ! grep -Eq "^[0-9a-f]{64}  ${required_bin}$" cosign_checksums.txt; then
              echo "Missing or invalid SHA for ${required_bin} in cosign_checksums.txt" >&2
              exit 1
            fi
          done

          verified_sha=$(sha256sum "${RUNNER_TEMP}/cosign-verify/cosign" | cut -d' ' -f1)
          expected_linux_amd64_sha=$(awk '$2 == "cosign-linux-amd64" { print $1; exit }' cosign_checksums.txt)
          if [[ "${verified_sha}" != "${expected_linux_amd64_sha}" ]]; then
            echo "SHA mismatch between verified cosign binary (${verified_sha}) and cosign_checksums.txt (${expected_linux_amd64_sha})" >&2
            exit 1
          fi
          rm -rf "${RUNNER_TEMP}/cosign-verify"

          sed -i \
            -e "s/default: 'v[0-9][^']*'/default: '${VERSION}'/" \
            -e "s/bootstrap_version='v[0-9][^']*'/bootstrap_version='${VERSION}'/" \
            action.yml

          sed -i "s/cosign-release: 'v[0-9][^']*'/cosign-release: '${VERSION}'/" README.md

          if git diff --quiet action.yml README.md cosign_checksums.txt; then
            echo "action.yml, README.md, and cosign_checksums.txt are already up to date at ${VERSION}."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            git diff action.yml README.md cosign_checksums.txt
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Test updated action.yml
        if: steps.update_files.outputs.changed == 'true'
        uses: ./

      - name: Verify installed Cosign version
        if: steps.update_files.outputs.changed == 'true'
        shell: bash
        run: cosign version

      - name: Create Pull Request
        if: steps.update_files.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          branch="update-cosign-${VERSION}"

          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "${branch}"
          git add action.yml README.md cosign_checksums.txt
          git commit -s -m "Bump cosign to ${VERSION#v}"
          git push --force origin "HEAD:refs/heads/${branch}"

          existing_pr=$(gh pr list --head "${branch}" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -n "${existing_pr}" ]]; then
            echo "Updated existing pull request: ${existing_pr}"
          else
            pr_url=$(gh pr create \
              --base main \
              --head "${branch}" \
              --title "Bump cosign to ${VERSION#v}" \
              --body "Updates the default \`cosign-release\` and \`cosign_checksums.txt\` (and example in \`README.md\`) to [Cosign ${VERSION}](https://github.com/sigstore/cosign/releases/tag/${VERSION}).")
            echo "Created pull request: ${pr_url}"
          fi
